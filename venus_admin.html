    if(raw.includes('one-time')||raw.includes('coupon')) return 'One-time';

function financeNumber(v){return Number(String(v||'0').replace(/[^0-9.]/g,''))||0}
function rangeMultiplier(){return {today:.04,week:.24,month:1,year:10}[state.range]||1}
function aed(n){return 'AED '+Math.round(n).toLocaleString('en-US')}
function revenueSnapshot(){
 const m=rangeMultiplier();
 const redeemed=Math.round(settlements.reduce((a,s)=>a+financeNumber(s[3]),0)*m);
 const couponRevenue=redeemed*5;
 const subscriptionRevenue=Math.round(87450*m);
 const adRevenue=Math.round(12300*m);
 const merchantPaid=Math.round(1350*m);
 const outstanding=Math.max(0,couponRevenue-merchantPaid);
 const totalRevenue=couponRevenue+subscriptionRevenue+adRevenue;
 return {redeemed,couponRevenue,subscriptionRevenue,adRevenue,totalRevenue,merchantPaid,outstanding};
}

</div>`}

function loadCategories(){try{const saved=JSON.parse(localStorage.getItem('soorkadehCategories'));return Array.isArray(saved)?saved:defaultCategories}catch(e){return defaultCategories}}

function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function categoryChildren(parentId){return categories.filter(c=>(c.parentId||null)===(parentId||null))}
function renderCategoryNodes(parentId=null,depth=0){return categoryChildren(parentId).map(cat=>{const children=categoryChildren(cat.id),closed=collapsedCategories.has(cat.id);return `<div class="category-node"><div class="category-item"><button class="category-toggle ${children.length?'':'blank'} ${closed?'closed':''}" onclick="toggleCategory('${cat.id}')" aria-label="${t('show')}"><svg class="svg" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><div class="category-info"><b>${escapeHtml(cat.name)}</b><small>${children.length} ${t('childrenCount')}</small></div><div class="category-actions"><button class="action-icon success" onclick="openCategoryModal(null,'${cat.id}')" title="${t('newSubcategory')}">${icons.plus}</button><button class="action-icon" onclick="openCategoryModal('${cat.id}')" title="${t('edit')}">${icons.edit}</button><button class="action-icon danger" onclick="deleteCategory('${cat.id}')" title="${t('delete')}">${icons.reject}</button></div></div>${children.length?`<div class="category-children ${closed?'hidden-branch':''}">${renderCategoryNodes(cat.id,depth+1)}</div>`:''}</div>`}).join('')}

function toggleCategory(id){collapsedCategories.has(id)?collapsedCategories.delete(id):collapsedCategories.add(id);renderPage()}

function submitCategory(id,parentId){const input=document.getElementById('categoryNameInput'),name=input.value.trim();if(!name){toast(t('requiredCategoryName'));input.focus();return}const duplicate=categories.some(c=>c.id!==id&&(c.parentId||'')===(parentId||'')&&c.name.toLocaleLowerCase()===name.toLocaleLowerCase());if(duplicate){toast(t('categoryExists'));return}if(id){const cat=categories.find(c=>c.id===id);if(cat)cat.name=name}else categories.push({id:'cat-'+Date.now().toString(36),name,parentId:parentId||null});saveCategories();closeModal();renderPage();toast(t('categorySaved'))}
function deleteCategory(id){confirmAction(local('حذف دسته‌بندی','Delete category'),t('deleteCategoryConfirm'),()=>{const removeIds=new Set([id]);let changed=true;while(changed){changed=false;categories.forEach(c=>{if(c.parentId&&removeIds.has(c.parentId)&&!removeIds.has(c.id)){removeIds.add(c.id);changed=true}})}categories=categories.filter(c=>!removeIds.has(c.id));saveCategories();renderPage();toast(t('categoryDeleted'))},'danger')}

  }

function cleanMerchantTabFields(root){if(!root)return;const publicationLabels=[local('وضعیت انتشار','Publication status'),'وضعیت انتشار','Publication status'];root.querySelectorAll('#merchantTabInfo .merchant-readonly-field,#merchantEditInfo .merchant-edit-field').forEach(field=>{const label=field.querySelector('label')?.textContent.trim();if(publicationLabels.includes(label))field.remove()});root.querySelectorAll('#merchantTabGallery .merchant-media-fields>*,#merchantEditGallery .merchant-media-fields>*').forEach(field=>{const label=(field.querySelector('small')?.textContent||field.childNodes?.[0]?.textContent||'').trim();if([local('وضعیت','Status'),'وضعیت','Status'].includes(label))field.remove()});root.querySelectorAll('#merchantTabPlan .merchant-plan-features,#merchantEditPlan .merchant-plan-features').forEach(section=>section.remove())}
const openMerchantProfileCleaned=openMerchantProfile;openMerchantProfile=function(id,name){openMerchantProfileCleaned(id,name);cleanMerchantTabFields(document.querySelector('.merchant-profile'))};
const openMerchantModalCleaned=openMerchantModal;openMerchantModal=function(name){openMerchantModalCleaned(name);cleanMerchantTabFields(document.querySelector('.merchant-edit'))};
function merchantProfileChangeSet(requestId){if(requestId==='AP-101'){const empty=local('ثبت نشده','Not registered');return {0:[[local('اطلاعات کسب‌وکار','Business information'),empty,local('باشگاه بلو پول · تفریح و سرگرمی','Blue Pool Club · Entertainment')]],1:[[local('گالری تصاویر','Image gallery'),empty,local('۳ تصویر و ۱ ویدئو','3 images and 1 video')]],2:[[local('آدرس و ساعت کاری','Address and working hours'),empty,local('دبی مارینا · همه‌روزه ۹ تا ۲۳','Dubai Marina · Daily 09:00–23:00')]],3:[[local('اسناد و مدارک','Documents'),empty,local('۳ مدرک کسب‌وکار','3 business documents')]],4:[[local('تنظیمات پکیج‌ها','Package settings'),empty,local('۳ پکیج با قیمت میانگین و تخفیف','3 packages with average price and discount')]],5:[[local('پلن همکاری','Partner plan'),empty,'Business Partner']]}}if(requestId==='AP-103')return {0:[[local('شماره تماس','Phone number'),'+971 50 120 4567','+971 50 000 0000']],3:[[local('مجوز فعالیت کسب‌وکار','Business license'),local('نسخه منقضی‌شده · 2025/12/31','Expired copy · 2025/12/31'),local('نسخه جدید · 2027/12/31','New copy · 2027/12/31')]],4:[[local('غذای اصلی · درصد تخفیف','Main course · Discount'),'20%','30%'],[local('غذای اصلی · میانگین قیمت','Main course · Average price'),'AED 90','AED 105']]};return {0:[[local('شماره تماس','Phone number'),'+971 50 111 2840','+971 50 000 0000'],[local('توضیحات عمومی','Public description'),local('رستوران ایرانی در دبی مارینا.','Persian restaurant in Dubai Marina.'),local('رستوران آریانا با منوی اصیل ایرانی و بین‌المللی و فضای خانوادگی.','Ariana Restaurant offers authentic Persian and international cuisine in a family setting.')]],1:[[local('تصویر اصلی گالری','Main gallery image'),local('تصویر قبلی نمای ورودی','Previous entrance image'),local('تصویر جدید نمای اصلی رستوران','New restaurant exterior image')]],2:[[local('آدرس کامل','Full address'),local('دبی مارینا، برج A، واحد G08','Dubai Marina, Tower A, Unit G08'),local('دبی مارینا، مارینا پلازا، واحد G12','Dubai Marina, Marina Plaza, Unit G12')],[local('ساعت کاری پنجشنبه','Thursday working hours'),'10:00 – 23:30','10:00 – 00:30']]}}
function merchantChangeComparison(changes){return `<div class="merchant-change-comparison"><div class="merchant-change-head"><b>${local('مقایسه تغییرات این بخش','Changes in this section')}</b><span>${changes.length} ${local('تغییر','changes')}</span></div>${changes.map(([field,before,after])=>`<article class="merchant-change-row"><b>${field}</b><div class="merchant-change-before"><small>${local('مقدار قبلی','Previous value')}</small><span>${escapeHtml(before)}</span></div><div class="merchant-change-arrow">←</div><div class="merchant-change-after"><small>${local('مقدار جدید','New value')}</small><span>${escapeHtml(after)}</span></div></article>`).join('')}</div>`}
function decorateMerchantProfileEditReview(requestId){const request=merchantApprovalRows.find(item=>item.id===requestId),root=document.querySelector('.merchant-approval-review');if(!request||!root)return;const isNew=request.type==='merchant';root.classList.add(isNew?'new-merchant-review':'profile-edit-review');const changes=merchantProfileChangeSet(requestId),panels=[...root.querySelectorAll('.merchant-profile-tab')],buttons=[...root.querySelectorAll('.merchant-profile-tabs button')],changedCount=Object.keys(changes).length;root.querySelector('.approval-review-summary')?.insertAdjacentHTML('afterend',`<div class="profile-change-overview"><div><b>${isNew?local('خلاصه اطلاعات ارسالی جدید','New submission summary'):local('خلاصه تغییرات پروفایل','Profile change summary')}</b><small>${isNew?local('برای ثبت‌نام جدید، اطلاعات قبلی وجود ندارد و همه موارد به‌عنوان داده جدید نمایش داده می‌شوند.','New registrations have no previous version; all submitted data is shown as new.'):local('بخش‌های بدون تغییر به‌صورت خودکار توسط سیستم تأیید شده‌اند.','Unchanged sections are approved automatically by the system.')}</small></div><div><span class="pill amber">${changedCount} ${isNew?local('بخش ارسالی','submitted sections'):local('بخش تغییرکرده','changed sections')}</span><span class="pill green">${panels.length-changedCount} ${local('تأیید خودکار','auto-approved')}</span></div></div>`);panels.forEach((panel,index)=>{const sectionChanges=changes[index]||[],changed=sectionChanges.length>0,button=buttons[index],approvalInput=panel.querySelector('[data-approval-section]'),approvalCheck=panel.querySelector('.approval-section-check');button?.insertAdjacentHTML('beforeend',`<span class="tab-change-badge ${changed?'changed':'unchanged'}">${changed?(isNew?local('جدید','New'):local('تغییر کرده','Changed')):local('بدون تغییر','Unchanged')}</span>`);if(changed)approvalCheck?.insertAdjacentHTML('afterend',merchantChangeComparison(sectionChanges));else{if(approvalInput){approvalInput.checked=true;approvalInput.disabled=true;approvalInput.dataset.autoApproved='true'}approvalCheck?.classList.add('auto-approved');const checkTitle=approvalCheck?.querySelector('b'),checkHint=approvalCheck?.querySelector('small');if(checkTitle)checkTitle.textContent=local('تأیید خودکار سیستم','System auto-approval');if(checkHint)checkHint.textContent=local('این بخش تغییری نداشته و نیازمند بررسی دستی نیست.','This section is unchanged and does not require manual review.');approvalCheck?.insertAdjacentHTML('afterend',`<div class="merchant-no-change">✓ <span>${local('این بخش نسبت به نسخه تأییدشده قبلی تغییری نکرده است.','This section is unchanged from the previously approved version.')}</span></div>`)}});updateMerchantApprovalDefects()}
const openMerchantApprovalReviewWithDiff=openMerchantApprovalReview;openMerchantApprovalReview=function(requestId){openMerchantApprovalReviewWithDiff(requestId);decorateMerchantProfileEditReview(requestId)};
pageApprovals=function(){
 if(!['all','merchant','profile'].includes(state.approvalFilter))state.approvalFilter='all';
 const list=merchantApprovalRows.filter(item=>state.approvalFilter==='all'||item.type===state.approvalFilter);
 const filters=[['all',local('همه','All')],['merchant',local('ثبت‌نام مرچنت جدید','New merchant registration')],['profile',local('ویرایش پروفایل مرچنت','Merchant profile edit')]];
 const rows=list.map(item=>{
  const deficienciesReported=item.id==='AP-103';
  const statusText=deficienciesReported?local('اعلام نواقص','Deficiencies reported'):local('در انتظار بررسی','Awaiting review');
  const reviewButton=deficienciesReported
   ?`<button class="btn approval-review-button approval-review-disabled" disabled aria-disabled="true" title="${local('نواقص به مرچنت اعلام شده است.','Deficiencies have been reported to the merchant.')}">${local('بررسی','Review')}</button>`
   :`<button class="btn primary approval-review-button" onclick="openMerchantApprovalReview('${item.id}')">${local('بررسی','Review')}</button>`;
  return `<tr><td>${item.id}</td><td><span class="pill ${item.type==='merchant'?'green':'purple'}">${local(item.typeFa,item.typeEn)}</span></td><td><b>${local(item.titleFa,item.titleEn)}</b><br><small>${item.merchantId}</small></td><td>${local(item.ownerFa,item.ownerEn)}</td><td>${local(item.categoryFa,item.categoryEn)}</td><td><span class="pill ${deficienciesReported?'red':'amber'}">${statusText}</span></td><td>${local(item.dateFa,item.dateEn)}</td><td>${reviewButton}</td></tr>`;
 }).join('');
 return `${pageTitle(local('صف تأیید مرچنت‌ها','Merchant approval queue'),local('ثبت‌نام‌های جدید و تغییرات پروفایل مرچنت را بخش‌به‌بخش بررسی کنید.','Review new registrations and merchant profile changes section by section.'))}<div class="filterbar"><b>${local('نوع درخواست:','Request type:')}</b>${filters.map(([key,label])=>`<button class="${state.approvalFilter===key?'active':''}" onclick="state.approvalFilter='${key}';renderPage()">${label}</button>`).join('')}</div><div class="card table-wrap request-table"><table class="table" id="approvalsTable"><thead><tr><th>${thSearch('approvalsTable',0,local('کد درخواست','Request ID'))}</th><th>${thSearch('approvalsTable',1,local('نوع درخواست','Request type'))}</th><th>${thSearch('approvalsTable',2,local('نام مرچنت','Merchant name'))}</th><th>${thSearch('approvalsTable',3,local('مالک','Owner'))}</th><th>${thSearch('approvalsTable',4,local('دسته‌بندی مرچنت','Merchant category'))}</th><th>${thSearch('approvalsTable',5,local('وضعیت','Status'))}</th><th>${thSearch('approvalsTable',6,local('تاریخ','Date'))}</th><th>${local('عملیات','Action')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
};
removeCancelButtons();
new MutationObserver(mutations=>mutations.forEach(mutation=>mutation.addedNodes.forEach(node=>{if(node.nodeType===1){if(node.matches?.('button')&&/^(انصراف|لغو|cancel)$/i.test(node.textContent.trim()))node.remove();else removeCancelButtons(node)}}))).observe(document.body,{childList:true,subtree:true});
const changePlanPricingModeBeforeMatrix=changePlanPricingMode;
changePlanPricingMode=function(mode){changePlanPricingModeBeforeMatrix(mode);if(mode==='category'){enhanceCategoryPricingMatrix(document.querySelector('.plan-editor-page')||document);updatePlanPricingMatrix();}};
const filterPlanCategoriesBeforeMatrix=filterPlanCategories;
filterPlanCategories=function(value){const q=(value||'').trim().toLowerCase(),rows=document.querySelectorAll('.category-matrix-row');if(rows.length){rows.forEach(row=>row.style.display=!q||row.dataset.categoryName.includes(q)?'grid':'none');return;}filterPlanCategoriesBeforeMatrix(value)};
</script>
